# More option see https://github.com/DreamMaoMao/mango/wiki/

monitorrule=name:DP-1,width:1920,height:1080,refresh:165.002

# Autostart
exec-once=nicotine -s &
exec-once=navidrome --configfile "/home/lilac/.config/navidrome/navidrome.toml" &
exec-once=swaybg -i ~/Pictures/Wallpapers/ParadiseSlideShow/Lorraine_FranceSaturated.jpg
exec=killall waybar ; waybar

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 6
shadows_blur = 1
shadows_position_x = -6
shadows_position_y = -6
shadowscolor= 0x151515ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=fade
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0
fadeout_begin_opacity=1
animation_duration_move=125
animation_duration_open=125
animation_duration_tag=125
animation_duration_close=125
animation_duration_focus=125
animation_curve_open=0.61,1.0,0.88,1
animation_curve_move=0.61,1.0,0.88,1
animation_curve_tag=0.61,1.0,0.88,1
animation_curve_close=0.12,0,0.39,0
animation_curve_focus=0.61,1.0,0.88,1
animation_curve_opafadeout=0.12,0,0.39,0
animation_curve_opafadein=0.61,1.0,0.88,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=0
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=32
drag_tile_to_tile=1
drag_tile_small=1
drag
allow_tearing=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mous# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=31
gappiv=31
gappoh=25
gappov=25
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=5
rootcolor=0x201b14ff
bordercolor=0x42424280
dropcolor=0x8A9A73ff
splitcolor=0x8A9A73ff
focuscolor=0x8A9A73ff
maximizescreencolor=0x8A9A73ff
urgentcolor=0xB66467ff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,c,reload_config

# menu and terminal
bind=SUPER,r,spawn,rofi -display-drun "LAUNCH" -show drun
bind=SUPER,Return,spawn,alacritty
bind=SUPER,e,spawn,dolphin
bind=CTRL+SHIFT,b,spawn,rofi-bluetooth
bind=CTRL+SHIFT,u,spawn,alacritty --class updater --title Updater -e cachy-update


# exit
bind=SUPER,c,killclient
bind=SUPER+SHIFT,e,quit

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=SUPER,f,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=SHIFT+SUPER,f,togglefullscreen,
# bind=SUPER+SHIFT,minus,minimized,
bind=SUPER,o,toggleoverlay,
#bind=SHIFT,minus,restore_minimized
# bind=SUPER,minus,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
circle_layout=tile,monocle,scroller
bind=SUPER,w,switch_layout


# tag switch
bind=super,1,view,1,0
bind=super,2,view,2,0
bind=super,3,view,3,0
bind=super,4,view,4,0
bind=super,5,view,5,0
bind=super,6,view,6,0
bind=super,7,view,7,0
bind=super,8,view,8,0
bind=super,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=super+shift,1,tag,1,0
bind=super+shift,2,tag,2,0
bind=super+shift,3,tag,3,0
bind=super+shift,4,tag,4,0
bind=super+shift,5,tag,5,0
bind=super+shift,6,tag,6,0
bind=super+shift,7,tag,7,0
bind=super+shift,8,tag,8,0
bind=super+shift,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=noshadow:1,layer_name:notifications

# window rule
windowrule=noblur:1,isfloating:1,appid:flameshot
windowrule=isnoborder:1,noshadow:1,appid:Audacious
windowrule=isfloating:1,height:300,width:500,appid:updater
windowrule=isfloating:1,height:400,width:300,appid:nmtui
windowrule=isfloating:1,appid:albumcoverview

# screenshots
bind=NONE,Print,spawn,flameshot gui
